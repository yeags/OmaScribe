[package]
name = "omascribe"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A keyboard-first music transcription workbench"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
cpal = "0.15"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
